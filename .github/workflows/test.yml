name: Test
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test FUNC.Tests

  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: webui
        run: pnpm install

      # Tests run first: they generate the auto-import typings the type check needs.
      - name: Test
        working-directory: webui
        run: pnpm test

      - name: Type check
        working-directory: webui
        run: pnpm typecheck
